# Supporting services for phase 05.
#
# The language model is NOT here: Gemma 4 runs through LiteRT-LM on your own machine
# (see ../litert/README.md, `./litert/serve.sh`). This file only brings up the pieces
# around it, and the defaults are all CPU so a laptop can run the whole workshop.
#
#   docker compose up -d                      # Kokoro TTS (CPU) + Laya (CPU)
#   docker compose --profile gpu up -d        # same, but Kokoro on an NVIDIA GPU
#   docker compose --profile whisper up -d    # add Whisper, for STT_MODE=whisper
#
services:
  # ── Text-to-Speech (Kokoro, CPU) ───────────────────────────────────────────
  # OpenAI-compatible: POST /v1/audio/speech
  # Web UI for testing: http://localhost:8880/web/
  tts:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    container_name: voicebot-tts
    ports:
      - "8880:8880"
    restart: unless-stopped

  # ── Text-to-Speech (Kokoro, GPU) ───────────────────────────────────────────
  # Same API on the same port. Stop `tts` first: docker compose stop tts
  tts-gpu:
    image: ghcr.io/remsky/kokoro-fastapi-gpu:latest
    container_name: voicebot-tts-gpu
    profiles: ["gpu"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - "8880:8880"
    restart: unless-stopped

  # ── Speak vs handoff (Laya System-1) ───────────────────────────────────────
  # Fast typed decisions: POST http://localhost:8002/v1/systemone
  # Optional. Leave LAYA_BASE_URL empty in .env.local to skip it entirely.
  laya:
    build:
      context: ./laya-service
    container_name: voicebot-laya
    ports:
      - "8002:8000"
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - LAYA_DEVICE=cpu
      - LAYA_MODELS=english
      - LAYA_DEFAULT_MODEL=english
      - LAYA_PRELOAD=1
      - LAYA_MAX_LOADED=1
      - OMP_NUM_THREADS=4
      - TORCH_DISABLE_NATIVE_JIT=1
    volumes:
      - laya-hf-cache:/root/.cache/huggingface
    restart: unless-stopped

  # ── Speech-to-Text (Whisper via vLLM) ──────────────────────────────────────
  # Only needed for STT_MODE=whisper. Needs an NVIDIA GPU; on a laptop prefer
  # STT_MODE=gemma, which reuses the LiteRT-LM server you already have running.
  stt:
    image: vllm/vllm-openai:latest
    container_name: voicebot-stt
    profiles: ["whisper"]
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    ports:
      - "8001:8000"
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
    entrypoint:
      - /bin/bash
      - -c
      - |
        pip install --no-cache-dir soundfile av soxr
        exec vllm serve openai/whisper-large-v3-turbo --gpu-memory-utilization 0.10 --max-model-len 448 --trust-remote-code
    restart: unless-stopped

volumes:
  laya-hf-cache:
