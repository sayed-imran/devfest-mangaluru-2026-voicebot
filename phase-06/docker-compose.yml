# Supporting services for phase 06 — these run ON THE DGX SPARK, not on your laptop.
#
# Gemma 4 26B A4B itself is NOT in this file. It runs through LiteRT-LM directly on the
# Spark so it can use the GB10's unified memory without a container in the way:
#
#   ssh spark-065b
#   LITERT_HOST=0.0.0.0 ./litert/serve.sh gemma4-26b     # :8081, reachable from the room
#
# Then on the Spark:
#
#   docker compose up -d                      # Kokoro TTS (GPU) + Laya
#   docker compose --profile whisper up -d    # add Whisper, for STT_MODE=whisper
#
services:
  # ── Text-to-Speech (Kokoro, GPU) ───────────────────────────────────────────
  # OpenAI-compatible: POST /v1/audio/speech
  tts:
    image: ghcr.io/remsky/kokoro-fastapi-gpu:latest
    container_name: voicebot-tts
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - "8880:8880"
    restart: unless-stopped

  # ── Speak vs handoff (Laya System-1) ───────────────────────────────────────
  # CPU on purpose: it must not contend with the 26B for unified memory.
  laya:
    build:
      context: ./laya-service
    container_name: voicebot-laya
    ports:
      - "8002:8000"
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - LAYA_DEVICE=cpu
      - LAYA_MODELS=english
      - LAYA_DEFAULT_MODEL=english
      - LAYA_PRELOAD=1
      - LAYA_MAX_LOADED=1
      - OMP_NUM_THREADS=4
      - TORCH_DISABLE_NATIVE_JIT=1
    volumes:
      - laya-hf-cache:/root/.cache/huggingface
    restart: unless-stopped

  # ── Speech-to-Text (Whisper via vLLM) ──────────────────────────────────────
  # Only needed for STT_MODE=whisper. The 26B MoE has no audio input, so on the
  # Spark this is the route if you don't want to also serve an E-size model.
  stt:
    image: vllm/vllm-openai:latest
    container_name: voicebot-stt
    profiles: ["whisper"]
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    ports:
      - "8001:8000"
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
    entrypoint:
      - /bin/bash
      - -c
      - |
        pip install --no-cache-dir soundfile av soxr
        exec vllm serve openai/whisper-large-v3-turbo --gpu-memory-utilization 0.10 --max-model-len 448 --trust-remote-code
    restart: unless-stopped

volumes:
  laya-hf-cache:
